<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" role="img" aria-label="animated ascii drone flying over a terminal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; white-space: pre; }
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .bar { fill: #161b22; }
    .title { fill: #8b949e; font-size: 12px; }
    .star { fill: #6b7280; font-size: 14px; animation: twinkle 3s ease-in-out infinite; }
    .drone { fill: #a5b4fc; font-size: 16px; }
    .prompt { fill: #6366f1; font-size: 15px; }
    .cmd { fill: #e6edf3; font-size: 15px; }
    .out { fill: #7ee787; font-size: 15px; }
    .ground { fill: #30363d; font-size: 14px; }
    .cursor { fill: #a5b4fc; font-size: 15px; animation: blink 1s steps(1) infinite; }

    .fly { animation: fly 9s linear infinite; }
    .bob { animation: bob 1.2s ease-in-out infinite; }
    .fa { animation: spinA 0.24s steps(1) infinite; }
    .fb { animation: spinB 0.24s steps(1) infinite; }

    .l1 { animation: l1 14s infinite; }
    .l2 { animation: l2 14s infinite; }
    .l3 { animation: l3 14s infinite; }
    .l4 { animation: l4 14s infinite; }

    @keyframes fly   { from { transform: translateX(-140px); } to { transform: translateX(860px); } }
    @keyframes bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes spinA { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes spinB { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes l1 { 0%,3% { opacity: 0; } 4%,92% { opacity: 1; } 96%,100% { opacity: 0; } }
    @keyframes l2 { 0%,18% { opacity: 0; } 19%,92% { opacity: 1; } 96%,100% { opacity: 0; } }
    @keyframes l3 { 0%,33% { opacity: 0; } 34%,92% { opacity: 1; } 96%,100% { opacity: 0; } }
    @keyframes l4 { 0%,48% { opacity: 0; } 49%,92% { opacity: 1; } 96%,100% { opacity: 0; } }
  </style>

  <rect class="bg" x="1" y="1" width="838" height="328" rx="12"/>
  <path class="bar" d="M1 13a12 12 0 0 1 12-12h814a12 12 0 0 1 12 12v22H1z"/>
  <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="5" fill="#27c93f"/>
  <text class="title" x="420" y="22" text-anchor="middle">~/subhadip — zsh</text>

  <!-- sky -->
  <text class="star" x="60"  y="70"  style="animation-delay:0s">.</text>
  <text class="star" x="150" y="105" style="animation-delay:.8s">+</text>
  <text class="star" x="260" y="64"  style="animation-delay:1.6s">*</text>
  <text class="star" x="340" y="120" style="animation-delay:.4s">.</text>
  <text class="star" x="470" y="72"  style="animation-delay:2.1s">+</text>
  <text class="star" x="560" y="112" style="animation-delay:1.2s">.</text>
  <text class="star" x="650" y="66"  style="animation-delay:.2s">*</text>
  <text class="star" x="740" y="102" style="animation-delay:1.9s">+</text>
  <text class="star" x="790" y="64"  style="animation-delay:1s">.</text>

  <!-- the drone -->
  <g class="fly">
    <g class="bob">
      <g transform="translate(0,100)">
        <text class="drone fa" x="0" y="0">-o-   -o-</text>
        <text class="drone fb" x="0" y="0">_o_   _o_</text>
        <text class="drone" x="0" y="16">  \\_//</text>
        <text class="drone" x="0" y="32">  [oo]</text>
      </g>
    </g>
  </g>

  <text class="ground" x="20" y="172">_._-'-._.-'-._._.-'-._-._.-'-._._-'-._.-'-._._.-'-._-._.-'-._._-'-._.-'-._._.-'-._-._.-'-._.</text>

  <!-- terminal -->
  <g class="l1"><text class="prompt" x="24" y="206">$</text><text class="cmd" x="42" y="206">whoami</text></g>
  <g class="l1"><text class="out" x="24" y="226">subhadip: makes things that think, move, or occasionally both</text></g>

  <g class="l2"><text class="prompt" x="24" y="252">$</text><text class="cmd" x="42" y="252">cat now.txt</text></g>
  <g class="l2"><text class="out" x="24" y="272">agents · evals · inference · firmware · bad ideas that work</text></g>

  <g class="l3"><text class="prompt" x="24" y="298">$</text><text class="cmd" x="42" y="298">uptime</text></g>
  <g class="l4"><text class="out" x="110" y="298">running on chai and curiosity</text></g>
  <g class="l4"><text class="cursor" x="400" y="298">█</text></g>
</svg>
